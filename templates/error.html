{% extends "base.html" %}

{% block title %}Error {{ error_code }} &bull; Student Academic Progression System{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 4rem auto; text-align: center;">
    <div style="font-size: 4rem; font-weight: 800; color: var(--primary); line-height: 1;">{{ error_code }}</div>
    <h1 style="font-size: 1.4rem; font-weight: 700; margin: 1rem 0 0.5rem 0;">Something Went Wrong</h1>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">{{ message }}</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
